services:
  database:
    container_name: "postgres-dev-socioeducativo"
    image: "postgres:16.6-alpine3.20"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev-socioeducativo"
    image: "sj26/mailcatcher"
    ports:
      - "1025:1025"
      - "1080:1080"
